name: bigslice
channels:
  - conda-forge
  - bioconda
dependencies:
  - bzip2
  - ca-certificates
  - certifi
  - hmmer=3.3.2
  - libffi
  - ncurses
  - openssl
  - pip
  - python=3.10
  - readline
  - setuptools
  - sqlite
  - tk
  - tzdata
  - wheel
  - xz
  - zlib
  - wget
  - unzip
  - pip:
    - biopython==1.76
    - joblib==1.2.0
    - numpy==1.23.5
    - pandas==1.5.2
    - pysqlite3==0.5.0
    - python-dateutil==2.8.2
    - pytz==2022.6
    - scikit-learn==1.2.0
    - scipy==1.9.3
    - six==1.16.0
    - threadpoolctl==3.1.0
    - git+https://github.com/NBChub/bigslice.git@c0085de
